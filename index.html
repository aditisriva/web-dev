<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Browser tab title -->
  <title>Support My Instagram Post</title>

  <!-- Open Graph (link preview data) -->
  <meta property="og:title" content="Support My Instagram Post ❤️">
  <meta property="og:description" content="Please repost this story and tag @aditisrivastava">
  <meta property="og:image" content="https://images.unsplash.com/photo-1520975916090-3105956dac38">
  <meta property="og:type" content="website">
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  font-family:Arial, sans-serif;
">

  <!-- Main Card -->
  <div style="
    background:white;
    padding:30px;
    max-width:380px;
    width:90%;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
  ">

    <h2 style="margin-top:0;">❤️ Support My Instagram Post</h2>

    <p>Please repost this post on your Instagram Story</p>

    <p><b>Tag:</b> @aditisrivastava</p>

    <!-- View Instagram Post -->
    <a
      href="https://www.instagram.com/p/DS5eI3ADXwi/"
      target="_blank"
      style="
        display:block;
        margin:20px 0;
        padding:14px;
        background:#E1306C;
        color:white;
        text-decoration:none;
        border-radius:8px;
      "
    >
      View Instagram Post
    </a>

    <!-- Instructions -->
    <div style="font-size:13px;color:#555;text-align:left;margin-bottom:15px;">
      <b>How to repost:</b>
      <ol style="padding-left:18px;">
        <li>Open the Instagram post</li>
        <li>Tap the <b>Share (↗)</b> icon</li>
        <li>Select <b>Add to Story</b></li>
        <li>Tag anyone you want</li>
      </ol>
    </div>

    <!-- WhatsApp Message Box -->
    <textarea
      id="waMessage"
      placeholder="Type your WhatsApp message here..."
      style="
        width:100%;
        height:80px;
        padding:10px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:14px;
        resize:none;
      "
    >Hey! Please support me by reposting this Instagram post and tagging @aditisrivastava ❤️
https://www.instagram.com/p/DS5eI3ADXwi/
    </textarea>

    <!-- Send WhatsApp Button -->
    <button
      onclick="sendToWhatsApp()"
      style="
        margin-top:12px;
        width:100%;
        padding:14px;
        background:#25D366;
        color:white;
        border:none;
        border-radius:8px;
        font-size:15px;
        cursor:pointer;
      "
    >
      Send on WhatsApp
    </button>

    <p style="margin-top:15px;font-size:12px;color:#777;">
      WhatsApp will open. Choose a contact and press Send.
    </p>

  </div>

  <!-- JavaScript -->
  <script>
    function sendToWhatsApp() {
      const message = document.getElementById("waMessage").value.trim();

      if (!message) {
        alert("Please type a message first.");
        return;
      }

      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = "https://wa.me/?text=" + encodedMessage;

      window.open(whatsappUrl, "_blank");
    }
  </script>

</body>
</html>
