<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Browser tab title -->
  <title>Support My Instagram Post</title>

  <!-- Open Graph (link preview data) -->
  <meta property="og:title" content="Support My Instagram Post ❤️">
  <meta property="og:description" content="Please repost this story and tag @aditisrivastava">
  <meta property="og:image" content="https://images.unsplash.com/photo-1520975916090-3105956dac38">
  <meta property="og:type" content="website">
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  font-family:Arial, sans-serif;
">

  <div style="
    background:white;
    padding:30px;
    max-width:360px;
    width:90%;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
  ">

    <h2 style="margin-top:0;">❤️ Support My Instagram Post</h2>

    <p>Please repost this post on your Instagram Story</p>

    <p><b>Tag:</b> @aditisrivastava</p>

    <a
      href="https://www.instagram.com/p/DS5eI3ADXwi/"
      target="_blank"
      style="
        display:block;
        margin:20px 0;
        padding:14px;
        background:#E1306C;
        color:white;
        text-decoration:none;
        border-radius:8px;
      "
    >
      View Instagram Post
    </a>

    <a
      href="instagram://story-camera"
      style="
        display:block;
        padding:14px;
        background:#405DE6;
        color:white;
        text-decoration:none;
        border-radius:8px;
      "
    >
      Open Instagram Story
    </a>

    <p style="margin-top:20px;font-size:12px;color:#777;">
      After Instagram opens, add the post to your story and tag @aditisrivastava
    </p>

  </div>

</body>
</html>
